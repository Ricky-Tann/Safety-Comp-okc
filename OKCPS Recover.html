<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKCPS Data Recovery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#f5f8fc;padding:16px;color:#1a202c;}
.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin-bottom:12px;}
h1{font-size:17px;font-weight:800;color:#1a2f4e;margin-bottom:4px;}
.sub{font-size:13px;color:#64748b;margin-bottom:14px;}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.green{background:#276749;color:#fff;}
.navy{background:#1a2f4e;color:#fff;}
.red{background:#c53030;color:#fff;}
.log{background:#1a202c;color:#68d391;border-radius:8px;padding:12px;font-size:12px;font-family:monospace;min-height:60px;max-height:400px;overflow-y:auto;white-space:pre-wrap;margin-top:8px;}
.ok{color:#68d391;} .err{color:#fc8181;} .info{color:#90cdf4;} .warn{color:#fbbf24;}
.session-card{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-bottom:8px;}
.session-id{font-size:11px;color:#64748b;font-family:monospace;margin-bottom:4px;}
.session-building{font-size:14px;font-weight:800;color:#1a2f4e;}
.session-meta{font-size:12px;color:#64748b;margin-top:2px;}
.session-count{font-size:12px;font-weight:700;color:#276749;margin-top:4px;}
.restore-btn{width:100%;padding:10px;border-radius:8px;border:none;background:#276749;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px;}
</style>
</head>
<body>

<div class="card">
  <h1>OKCPS Inspection Recovery</h1>
  <p class="sub">Finds all saved inspections in Supabase and lets you restore any of them.</p>
</div>

<div class="card">
  <button class="btn navy" onclick="scanAll()">🔍 Scan for All Saved Inspections</button>
  <div class="log" id="scan-log">Tap above to scan Supabase for your saved data…</div>
</div>

<div id="sessions-list"></div>

<div class="card" id="restore-result" style="display:none">
  <div class="log" id="restore-log"></div>
</div>

<script>
const SB_URL = "https://dkmmrdukdejvhuwptaug.supabase.co";
const SB_KEY = "sb_publishable_nHVinO6HJ4NWGslANndcHg_M0gopX3u";
const STORE  = "okcps_v5";

function log(elId, msg, cls) {
  var el = document.getElementById(elId);
  el.innerHTML += '\n<span class="'+(cls||"info")+'">'+msg+'</span>';
  el.scrollTop = el.scrollHeight;
}

async function scanAll() {
  var logEl = document.getElementById("scan-log");
  logEl.innerHTML = "";
  document.getElementById("sessions-list").innerHTML = "";

  log("scan-log", "Scanning live_answers table...", "info");

  try {
    // Get all unique session IDs
    var r = await fetch(
      SB_URL + "/rest/v1/live_answers?select=session_id,building,insp_date,inspector,status,updated_at&order=updated_at.desc",
      { headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY } }
    );

    if (!r.ok) {
      log("scan-log", "✗ Failed to fetch — status " + r.status, "err");
      return;
    }

    var rows = await r.json();
    log("scan-log", "✓ Found " + rows.length + " total answer rows", "ok");

    if (!rows.length) {
      log("scan-log", "No data found in live_answers table", "warn");
      return;
    }

    // Group by session_id
    var sessions = {};
    rows.forEach(function(row) {
      if (!sessions[row.session_id]) {
        sessions[row.session_id] = {
          sid:       row.session_id,
          building:  row.building  || "Unknown",
          date:      row.insp_date || "Unknown date",
          inspector: row.inspector || "Unknown",
          updated:   row.updated_at,
          count:     0,
          passed:    0,
          failed:    0,
        };
      }
      sessions[row.session_id].count++;
      if (row.status === "pass") sessions[row.session_id].passed++;
      if (row.status === "fail") sessions[row.session_id].failed++;
      // Keep most recent update time
      if (row.updated_at > sessions[row.session_id].updated) {
        sessions[row.session_id].updated = row.updated_at;
      }
    });

    var sessionList = Object.values(sessions).sort(function(a,b){
      return new Date(b.updated) - new Date(a.updated);
    });

    log("scan-log", "✓ Found " + sessionList.length + " inspection session(s)", "ok");

    // Render session cards
    var html = "";
    sessionList.forEach(function(s) {
      var updDate = new Date(s.updated).toLocaleString();
      html += '<div class="card session-card">'
        + '<div class="session-building">' + s.building + '</div>'
        + '<div class="session-meta">Date: ' + s.date + ' · Inspector: ' + s.inspector + '</div>'
        + '<div class="session-meta">Last saved: ' + updDate + '</div>'
        + '<div class="session-count">' + s.count + ' answered item(s) · ' + s.passed + ' Pass · ' + s.failed + ' Fail</div>'
        + '<div class="session-id">Session: ' + s.sid + '</div>'
        + '<button class="restore-btn" onclick="restoreSession(\'' + s.sid.replace(/'/g,"\\'") + '\',\'' + s.building.replace(/'/g,"\\'") + '\')">📥 Restore This Inspection</button>'
        + '</div>';
    });

    document.getElementById("sessions-list").innerHTML = html;

  } catch(e) {
    log("scan-log", "✗ Error: " + e.message, "err");
  }
}

async function restoreSession(sid, building) {
  var resultEl = document.getElementById("restore-result");
  var logEl    = document.getElementById("restore-log");
  resultEl.style.display = "block";
  logEl.innerHTML = "";

  log("restore-log", "Restoring inspection for " + building + "...", "info");

  try {
    // Fetch all answers for this session
    var ar = await fetch(
      SB_URL + "/rest/v1/live_answers?session_id=eq." + encodeURIComponent(sid) + "&select=*",
      { headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY } }
    );
    var answers = await ar.json();
    log("restore-log", "✓ Found " + answers.length + " answers", "ok");

    // Fetch meta
    var mr = await fetch(
      SB_URL + "/rest/v1/live_meta?session_id=eq." + encodeURIComponent(sid) + "&select=*",
      { headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY } }
    );
    var meta = await mr.json();

    // Build S object
    var S = {
      meta: { building:"", date:"", inspector:"", contact:"", type:"", weather:"", notes:"" },
      cond: { hasFDC:null, hasElevator:null },
      nums: { aedCount:"" },
      dates: { wh_lastInspDate:"" },
      signoff: { inspectorSig:"", principalSig:"" },
      answers: {},
      hazards: [],
    };

    // Restore meta
    if (meta && meta.length > 0) {
      var m = meta[0];
      S.meta.building  = m.building  || "";
      S.meta.date      = m.insp_date || "";
      S.meta.inspector = m.inspector || "";
      S.meta.contact   = m.contact   || "";
      S.meta.type      = m.insp_type || "";
      S.meta.weather   = m.weather   || "";
      S.meta.notes     = m.notes     || "";
      try { S.cond    = JSON.parse(m.cond_json    || "{}"); } catch(e){}
      try { S.nums    = JSON.parse(m.nums_json    || "{}"); } catch(e){}
      try { S.dates   = JSON.parse(m.dates_json   || "{}"); } catch(e){}
      try { S.hazards = JSON.parse(m.hazards_json || "[]"); } catch(e){}
      log("restore-log", "✓ Meta restored — Building: " + S.meta.building + " · Date: " + S.meta.date, "ok");
    }

    // Restore answers
    answers.forEach(function(row) {
      var photos = [];
      try { photos = JSON.parse(row.photos_json || "[]"); } catch(e){}
      S.answers[row.item_key] = {
        status:     row.status      || null,
        note:       row.note        || "",
        caRequired: row.ca_required || false,
        caDue:      row.ca_due      || "",
        photos:     photos,
      };
    });

    // Save to localStorage
    localStorage.setItem("okcps_v5", JSON.stringify(S));
    // Save session ID so form knows to restore it
    localStorage.setItem("okcps_session_id", sid);

    log("restore-log", "✓ " + answers.length + " answers saved to localStorage", "ok");
    log("restore-log", "", "");
    log("restore-log", "✅ DONE! Now open your inspection form:", "ok");
    log("restore-log", "ricky-tann.github.io/Safety-Comp-okc", "ok");
    log("restore-log", "", "");
    log("restore-log", "Your inspection will be fully restored.", "ok");

  } catch(e) {
    log("restore-log", "✗ Error: " + e.message, "err");
  }
}
</script>
</body>
</html>
